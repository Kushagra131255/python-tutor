<!DOCTYPE html>
<html>
<head>
<title>PyTutor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Outfit" rel="stylesheet">
</head>
<body>
<div class="app-container">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">🐍</div>
            <span>PyTutor</span>
        </div>
        <div class="user-info-box">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-details">
                <div class="user-name" id="userName">Loading...</div>
            </div>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()">➕ New Chat</button>
        <div class="sessions-section">
            <div class="sessions-title">Chat History</div>
            <div class="sessions-list" id="sessionsList"></div>
        </div>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logout()">↪ Logout</button>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div class="header-title">
                <h1>PyTutor</h1>
                <p id="chatTitle">New Chat</p>
            </div>
            <div class="header-actions">
                <button class="delete-btn" onclick="deleteCurrentChat()">🗑️</button>
            </div>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="quick-actions">
            <button onclick="sendQuick('help')">📋 Help</button>
            <button onclick="sendQuick('topics')">📚 Topics</button>
            <button onclick="sendQuick('quiz')">🧪 Quiz</button>
        </div>
        <div class="chat-input-area">
            <input id="userInput" type="text" placeholder="Ask me about Python..." autocomplete="off" ondrop="return false;" ondragstart="return false;">
            <button id="sendBtn" onclick="handleSend()">Send</button>
            <button id="stopBtn" onclick="stopTyping()" style="display:none;">⏹ Stop</button>
        </div>
    </div>
</div>

<script>
let currentSessionId = null;
let typingTimeout = null;
let isCurrentlyTyping = false;

function resetButtons() {
    document.getElementById('sendBtn').style.display = 'inline-block';
    document.getElementById('stopBtn').style.display = 'none';
}

function stopTyping() {
    isCurrentlyTyping = false;
    clearTimeout(typingTimeout);
    resetButtons();
    document.getElementById('typingIndicator')?.remove();
}

function addMessage(text, sender) {
    const chat = document.getElementById("chatMessages");
    const msg = document.createElement("div");
    msg.className = "message " + sender;
    msg.textContent = text;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
    const chat = document.getElementById("chatMessages");
    const div = document.createElement("div");
    div.className = "typing-indicator";
    div.id = "typingIndicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
    document.getElementById("typingIndicator")?.remove();
}

async function handleSend() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if(!text) return;
    
    addMessage(text, "user");
    input.value = "";
    document.getElementById('sendBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'inline-block';
    
    showTyping();
    await new Promise(r => setTimeout(r, 1000));
    hideTyping();
    
    try {
        const res = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: text, session_id: currentSessionId})
        });
        const data = await res.json();
        if(data.response) typeMessage(data.response);
    } catch(e) {
        hideTyping();
        addMessage("Error: " + e.message, "bot");
        resetButtons();
    }
}

function typeMessage(text) {
    const chat = document.getElementById("chatMessages");
    const msg = document.createElement("div");
    msg.className = "message bot";
    chat.appendChild(msg);
    isCurrentlyTyping = true;
    let i = 0;
    function type() {
        if(!isCurrentlyTyping || i >= text.length) {
            isCurrentlyTyping = false;
            resetButtons();
            return;
        }
        msg.textContent += text[i];
        i++;
        chat.scrollTop = chat.scrollHeight;
        typingTimeout = setTimeout(type, 30);
    }
    type();
}

function sendQuick(t) {
    document.getElementById("userInput").value = t;
    handleSend();
}

async function createNewChat() {
    try {
        const res = await fetch('/api/sessions', {method:'POST'});
        const data = await res.json();
        currentSessionId = data.session_id;
        document.getElementById('chatMessages').innerHTML = '';
        document.getElementById('chatTitle').textContent = 'New Chat';
        
        showTyping();
        await new Promise(r => setTimeout(r, 1000));
        const wr = await fetch('/welcome');
        const wd = await wr.json();
        hideTyping();
        typeMessage(wd.response);
        loadSessions();
    } catch(e) { hideTyping(); addMessage("Error", "bot"); }
}

async function deleteCurrentChat() {
    if(!currentSessionId) return;
    if(!confirm("Delete this chat?")) return;
    
    try {
        // Delete current session
        await fetch('/api/sessions/'+currentSessionId, {method:'DELETE'});
        
        // Get remaining sessions
        const res = await fetch('/api/sessions');
        const data = await res.json();
        
        document.getElementById('chatMessages').innerHTML = '';
        
        if(data.sessions && data.sessions.length > 0) {
            // Load the first available session
            const firstSession = data.sessions[0];
            await loadSession(firstSession.id);
        } else {
            // No sessions left, create new one
            await createNewChat();
        }
        
        loadSessions();
    } catch(e) { 
        console.error(e); 
    }
}

async function loadSessions() {
    try {
        const res = await fetch('/api/sessions');
        const data = await res.json();
        const list = document.getElementById('sessionsList');
        list.innerHTML = '';
        if(data.sessions) {
            data.sessions.forEach(s => {
                const div = document.createElement('div');
                div.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
                div.textContent = s.title;
                div.onclick = () => loadSession(s.id);
                list.appendChild(div);
            });
        }
    } catch(e) { console.error(e); }
}

async function loadSession(id) {
    try {
        const res = await fetch('/api/sessions/'+id+'/messages');
        const data = await res.json();
        currentSessionId = id;
        
        const chatDiv = document.getElementById('chatMessages');
        chatDiv.innerHTML = '';
        chatDiv.style.overflow = 'auto';
        
        document.getElementById('chatTitle').textContent = data.title || 'Chat';
        
        if(data.messages) {
            data.messages.forEach(m => addMessage(m.content, m.role));
        }
        
        setTimeout(() => {
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }, 100);
        
        document.getElementById('sidebar').classList.remove('open');
        loadSessions();
    } catch(e) { alert("Error loading chat"); }
}

function logout() { window.location.href = '/logout'; }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

document.getElementById("userInput").addEventListener("keydown", e => {
    if(e.key === "Enter") handleSend();
});

async function loadUserInfo() {
    const res = await fetch('/api/user');
    if(res.ok) {
        const data = await res.json();
        document.getElementById('userName').textContent = data.name || 'User';
        document.getElementById('userAvatar').textContent = data.name ? data.name[0].toUpperCase() : '👤';
    }
}

window.onload = async () => {
    await loadUserInfo();
    await loadSessions();
    await createNewChat();
};
</script>
</body>
</html>
